name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: build stamp
        run: |
          H=$(git rev-parse --short HEAD)
          sed -i "s/data-build=\"dev\"/data-build=\"$H\"/; s/src=\"v06x.js\"/src=\"v06x.js?v=$H\"/; s/src=\"app.js\"/src=\"app.js?v=$H\"/" site/index.html
          sed -i "s#from './keys.js'#from './keys.js?v=$H'#" site/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
